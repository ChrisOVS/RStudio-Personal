name: Deploy finance app to Pages

on:
  push:
    branches: [main]
    paths:
      - 'finance-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queued rather than cancelled, so a run already
# publishing is never killed half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The engines are pure modules with no dependencies, so this is the real
      # test suite, not a smoke check. A red build must not reach the site.
      - name: Run tests
        working-directory: finance-app
        run: npm test

      - name: Build the standalone file
        working-directory: finance-app
        run: node build-single-file.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r finance-app/index.html \
                finance-app/styles.css \
                finance-app/js \
                finance-app/icons \
                finance-app/manifest.webmanifest \
                finance-app/sw.js \
                _site/
          # Offer the single-file build as a download alongside the app.
          cp finance-app/dist/paycheck-calculator.html _site/standalone.html
          # Stamp the service worker so each deploy gets its own cache and the
          # previous one is dropped. Left as a constant, a fix would never land.
          sed -i "s/__BUILD__/${GITHUB_SHA::12}/" _site/sw.js
          # Jekyll would otherwise ignore anything starting with an underscore.
          touch _site/.nojekyll

      - name: Verify the build actually works
        run: |
          test -s _site/index.html
          test -s _site/js/app.js
          test -s _site/standalone.html
          grep -q "${GITHUB_SHA::12}" _site/sw.js
          # Every script the page loads must be present, or we ship a dead page.
          for f in $(grep -o 'src="js/[^"]*"' _site/index.html | sed 's/src="//;s/"//'); do
            test -s "_site/$f" || { echo "missing $f"; exit 1; }
          done

      # Pages has to be switched on once by hand: Settings -> Pages -> Source:
      # "GitHub Actions". The workflow token is not allowed to create the site
      # itself, so `enablement: true` only produced "Resource not accessible by
      # integration" and failed the whole run.
      #
      # Publishing is therefore optional. Tests and the build still run and
      # still gate merges; only the deploy is skipped, with a note saying which
      # setting to flip — a red X on every push for a setting nobody has flipped
      # is noise, not a signal.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Explain that publishing was skipped
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=Pages not enabled::Tests and build passed. To publish, enable Pages once: Settings -> Pages -> Source: GitHub Actions, then re-run this workflow."

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
